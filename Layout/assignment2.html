<!DOCTYPE html>
<html>
<head>
    <title>Lists</title>
</head>
<body>

<h2>Ordered List</h2>
<ol>
    <li>Java</li>
    <li>Python</li>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
</ol>

<h2>Unordered List</h2>
<ul>
    <li>Apple</li>
    <li>Mango</li>
    <li>Orange</li>
    <li>Banana</li>
    <li>Grapes</li>
</ul>

</body>
</html>
