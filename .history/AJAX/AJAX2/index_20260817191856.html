<!DOCTYPE html>
<html>
<head>

    <title>AJAX Database Application</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h2 {
            color: #333;
        }

        .form-container {
            width: 500px;
            padding: 25px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: inline-block;
            width: 130px;
            font-weight: bold;
        }

        input,
        select {
            width: 250px;
            padding: 8px;
            border: 1px solid #aaa;
            border-radius: 4px;
        }

        .message {
            margin-left: 10px;
            font-weight: bold;
        }

        .available {
            color: green;
        }

        .not-available {
            color: red;
        }

        .invalid {
            color: red;
        }

        button {
            padding: 10px 25px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

    </style>

    <script>

        function checkEmail() {

            // Get email value
            var email = document.getElementById("email").value.trim();

            var message = document.getElementById("emailMessage");

            // Email validation pattern
            var emailPattern =
                /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;

            // Check empty email
            if (email === "") {

                message.innerHTML = "";

                return;
            }

            // Check email format
            if (!emailPattern.test(email)) {

                message.innerHTML = "Invalid Email Id";

                message.className = "message invalid";

                return;
            }

            // Create AJAX object
            var xhr = new XMLHttpRequest();

            // Send request to Servlet
            xhr.open(
                "GET",
                "checkEmail?email=" + encodeURIComponent(email),
                true
            );

            // Process response
            xhr.onreadystatechange = function () {

                if (xhr.readyState === 4 && xhr.status === 200) {

                    var result = xhr.responseText.trim();

                    if (result === "Available") {

                        message.innerHTML = "Available";

                        message.className =
                            "message available";

                    } else {

                        message.innerHTML = "Not Available";

                        message.className =
                            "message not-available";
                    }
                }
            };

            // Send AJAX request
            xhr.send();
        }

    </script>

</head>

<body>

    <h2>Registration Form</h2>

    <div class="form-container">

        <form>

            <div class="form-group">

                <label>Email:</label>

                <input
                    type="text"
                    id="email"
                    name="email"
                    onblur="checkEmail()"
                    placeholder="Enter Email"
                >

                <span id="emailMessage"
                      class="message">
                </span>

            </div>


            <div class="form-group">

                <label>Password:</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter Password"
                >

            </div>


            <div class="form-group">

                <label>Name:</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter Name"
                >

            </div>


            <div class="form-group">

                <label>Date of Birth:</label>

                <input
                    type="date"
                    name="dateofbirth"
                >

            </div>


            <div class="form-group">

                <label>Gender:</label>

                <select name="gender">

                    <option value="">Select Gender</option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>City:</label>

                <input
                    type="text"
                    name="city"
                    placeholder="Enter City"
                >

            </div>


            <div class="form-group">

                <label>Pincode:</label>

                <input
                    type="text"
                    name="pincode"
                    placeholder="Enter Pincode"
                >

            </div>


            <div class="form-group">

                <label>Mobile:</label>

                <input
                    type="text"
                    name="mobile"
                    placeholder="Enter Mobile"
                >

            </div>


            <button type="submit">
                Register
            </button>

        </form>

    </div>

</body>
</html>
