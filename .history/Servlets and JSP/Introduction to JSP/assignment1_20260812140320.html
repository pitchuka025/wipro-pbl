<!DOCTYPE html>
<html>
<head>
    <title>Prime Numbers Finder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
        }
        .container {
            background-color: #f0f0f0;
            padding: 20px;
            border-radius: 5px;
            width: 400px;
        }
        h1 {
            color: #333;
        }
        input[type="text"] {
            padding: 8px;
            width: 100%;
            margin: 10px 0;
            box-sizing: border-box;
        }
        input[type="submit"] {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            width: 100%;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Prime Numbers Finder</h1>
        <form action="PrimeServlet" method="post">
            <label for="number">Enter a number:</label>
            <input type="text" id="number" name="number" placeholder="Enter a number" required>
            <input type="submit" value="Find Prime Numbers">
        </form>
    </div>
</body>
</html>
