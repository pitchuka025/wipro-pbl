<!DOCTYPE html>
<html>
<head>
<title>Forms Using DIV</title>

<style>

body{
    font-family:Arial;
    background:#f2f2f2;
}

.container{
    width:900px;
    margin:auto;
}

.box{
    border:2px solid black;
    padding:20px;
    margin:20px;
    background:white;
}

table{
    width:100%;
}

td{
    padding:8px;
}

h2{
    text-align:center;
}

</style>

</head>

<body>

<div class="container">

<!-- Visitor Information Form -->

<div class="box">

<h2>Visitor Information</h2>
<hr>

<form>

<table>

<tr>
<td>Email Address</td>
<td><input type="email"></td>
</tr>

<tr>
<td>Interest</td>
<td>
<input type="checkbox"> Research
<input type="checkbox"> Purchase
</td>
</tr>

<tr>
<td>Occupation</td>
<td>
<select>
<option selected>Select One</option>
<option>Student</option>
<option>Employee</option>
<option>Business</option>
</select>
</td>
</tr>

<tr>
<td>Send Junk Emails?</td>
<td>
<input type="radio" name="mail"> Absolutely
<input type="radio" name="mail"> No Way Man
</td>
</tr>

<tr>
<td colspan="2" align="center">
<input type="submit" value="Submit">
<input type="reset" value="Reset">
</td>
</tr>

</table>

</form>

</div>

<!-- Registration Form -->

<div class="box">

<h2>Online Registration</h2>

<form>

<table>

<tr>
<td>Username</td>
<td><input type="text"></td>
</tr>

<tr>
<td>Password</td>
<td><input type="password"></td>
</tr>

<tr>
<td>Confirm Password</td>
<td><input type="password"></td>
</tr>

<tr>
<td>Name</td>
<td><input type="text"></td>
</tr>

<tr>
<td>Gender</td>
<td>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
</td>
</tr>

<tr>
<td>Address</td>
<td>
<textarea rows="4" cols="30"></textarea>
</td>
</tr>

<tr>
<td>Profession</td>
<td>
<select>
<option>Student</option>
<option>Engineer</option>
<option>Teacher</option>
<option>Doctor</option>
</select>
</td>
</tr>

<tr>
<td colspan="2" align="center">
<input type="submit" value="Register">
<input type="reset" value="Reset">
</td>
</tr>

</table>

</form>

</div>

</div>

</body>
</html>
